[package]
name = "musli-web"
version = "0.4.5"
authors = ["John-John Tedro <udoprog@tedro.se>"]
edition = "2024"
description = """
Types for integrating Müsli with websocket frameworks.
"""
documentation = "https://docs.rs/musli"
readme = "README.md"
homepage = "https://github.com/udoprog/musli"
repository = "https://github.com/udoprog/musli"
license = "MIT OR Apache-2.0"
keywords = ["framework", "http", "web"]
categories = ["asynchronous", "network-programming", "web-programming::http-server"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "doc_cfg", "--generate-link-to-definition"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(doc_cfg, loom)'] }

[features]
default = ["alloc", "std"]
alloc = ["musli?/alloc"]
std = ["musli?/std"]
api = ["alloc", "dep:musli", "format-wire"]
axum08 = ["dep:axum08", "axum-core05", "dep:bytes", "dep:futures-core03", "dep:futures-sink03", "ws", "dep:tracing"]

# Body formats which can be negotiated. `format-wire` backs `Format::DEFAULT`
# and is therefore always enabled. Message envelopes use `musli::packed`, which
# requires no feature at all.
format-packed = []
format-storage = ["musli/storage"]
format-wire = ["musli/wire"]
format-descriptive = ["musli/descriptive"]
format-json = ["musli/json"]
formats = ["format-packed", "format-storage", "format-wire", "format-descriptive", "format-json"]

client = ["std", "alloc", "api", "format-storage", "slab", "dep:bytes", "dep:rand", "dep:tracing", "tokio/sync", "tokio/time", "tokio/macros"]
tungstenite029 = ["client", "dep:tokio-tungstenite029", "dep:futures-core03", "dep:futures-sink03"]
tungstenite029-rustls = ["tungstenite029", "tokio-tungstenite029/rustls-tls-webpki-roots"]
json = ["musli/json", "std", "alloc", "dep:bytes", "dep:mime", "axum-core05", "dep:http"]
ws = ["std", "api", "format-storage", "dep:bytes", "dep:rand", "tokio/time", "axum-core05", "axum08/ws", "dep:tracing"]
yew022 = ["web03", "dep:yew022", "dep:implicit-clone06"]
yew023 = ["web03", "dep:yew023", "dep:implicit-clone06"]
web03 = ["std", "alloc", "api", "format-storage", "slab", "dep:web-sys03", "dep:tracing", "wasm_bindgen02"]
wasm_bindgen02 = ["dep:wasm-bindgen02"]
test = ["api", "json", "ws", "yew022", "yew023", "axum08", "tungstenite029", "formats"]

[dependencies]
musli-web-macros = { path = "../musli-web-macros", version = "0.4.5" }

musli = { path = "../musli", version = "0.1.0", default-features = false, optional = true }
http = { version = "1.3.1", default-features = false, optional = true }
bytes = { version = "1.10.0", default-features = false, optional = true }
mime = { version = "0.3.17", default-features = false, optional = true }
rand = { version = "0.10.0", default-features = false, optional = true }
tracing = { version = "0.1.40", default-features = false, optional = true, features = ["attributes"] }
tokio = { version = "1.37.0", default-features = false, optional = true }
slab = { version = "0.4.9", default-features = false, optional = true }

futures-core03 = { package = "futures-core", version = "0.3.0", default-features = false, optional = true }
futures-sink03 = { package = "futures-sink", version = "0.3.0", default-features = false, optional = true }
axum-core05 = { package="axum-core", version = "0.5.0", default-features = false, optional = true }
axum08 = { package = "axum", version = "0.8.0", default-features = false, optional = true }
implicit-clone06 = { package = "implicit-clone", version = "0.6.0", default-features = false, optional = true }
yew022 = { package = "yew", version = "0.22.0", default-features = false, optional = true }
yew023 = { package = "yew", version = "0.23.0", default-features = false, optional = true }
wasm-bindgen02 = { package = "wasm-bindgen", version = "0.2.0", default-features = false, optional = true }

[dependencies.tokio-tungstenite029]
package = "tokio-tungstenite"
version = "0.29.0"
default-features = false
features = ["connect", "handshake"]
optional = true

[dependencies.web-sys03]
package = "web-sys"
version = "0.3.0"
default-features = false
features = ["WebSocket", "MessageEvent", "BinaryType", "CloseEvent", "ErrorEvent", "Window", "Location"]
optional = true

[dev-dependencies]
anyhow = "1.0.99"
axum08 = { package = "axum", version = "0.8.0", features = ["ws"] }
musli = { path = "../musli", version = "0.1.0" }
tokio = { version = "1.37.0", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tracing = "0.1.40"

# This cfg cannot be enabled, but it still forces Cargo to keep
# musli-web-macros's version in lockstep with musli-web's, even if someone
# depends on the two crates separately with musli-web's "macros" feature
# disabled. Every musli-web-macros release is compatible with exactly one
# musli-web release because the generated code involves nonpublic APIs which are
# not bound by semver.
[target.'cfg(any())'.dependencies]
musli-web-macros = { path = "../musli-web-macros", version = "=0.4.5" }
