[package]
name = "musli-core"
version = "0.1.4"
authors = ["John-John Tedro <udoprog@tedro.se>"]
edition = "2024"
rust-version = "1.85"
description = """
Core traits and types for the Müsli serialization framework.
"""
documentation = "https://docs.rs/musli"
readme = "README.md"
homepage = "https://github.com/udoprog/musli"
repository = "https://github.com/udoprog/musli"
license = "MIT OR Apache-2.0"
keywords = ["no_std", "serialization"]
categories = ["encoding", "no-std", "no-std::no-alloc"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "doc_cfg", "--generate-link-to-definition"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(doc_cfg)'] }

[features]
default = ["std", "alloc"]
std = []
alloc = []
verbose = ["musli-macros/verbose"]

[dependencies]
musli-macros = { version = "0.1.5", path = "../musli-macros", default-features = false }

# This cfg cannot be enabled, but it still forces Cargo to keep musli-macros's
# version in lockstep with musli's, even if someone depends on the two crates
# separately with musli's "macros" feature disabled. Every musli-macros release
# is compatible with exactly one musli release because the generated code
# involves nonpublic APIs which are not bound by semver.
[target.'cfg(any())'.dependencies]
musli-macros = { version = "=0.1.5", path = "../musli-macros" }

[dev-dependencies]
musli = { version = "=0.1.1", path = "../musli", features = ["json"] }
